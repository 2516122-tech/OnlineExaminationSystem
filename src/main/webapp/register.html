<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f0edff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 0 15px #ccc;
        }

        h2 {
            text-align: center;
            color: #6336c5;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6336c5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #45219a;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration</h2>

    <form action="RegisterServlet" method="post">

        <input type="text"
               name="student_name"
               placeholder="Enter Your Name"
               required>

        <input type="email"
               name="email"
               placeholder="Enter Your Email"
               required>

        <input type="password"
               name="password"
               placeholder="Create Password"
               required
               minlength="8">

        <button type="submit">Register</button>

    </form>

    <p>Already registered?
       <a href="login.html">Login</a>
    </p>

</div>

</body>
</html>
