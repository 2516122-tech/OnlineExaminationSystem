<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f3efff;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        h2 {
            color: #663399;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            background: #663399;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Admin Login</h2>

        <form action="AdminLoginServlet" method="post">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
